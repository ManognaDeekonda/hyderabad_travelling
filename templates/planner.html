<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Planner</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<!-- Replace ONLY your <style> block in planner.html with this -->

<!-- Replace ONLY your current #particles-js style block with this upgraded one -->

<style>
body{
font-family:'Poppins',sans-serif;
background:#000000;
overflow-x:hidden;
color:white;
}

/* PARTICLE BACKGROUND */
#particles-js{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
background:#000000;

/* extra glow behind particles */
background-image:
radial-gradient(circle at 20% 20%, rgba(0,255,255,0.08), transparent 25%),
radial-gradient(circle at 80% 30%, rgba(217,70,239,0.08), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(255,255,255,0.05), transparent 25%);
}

/* MAIN CARD */
.glass{
position:relative;
z-index:10;
max-width:1100px;
width:100%;
margin:auto;
padding:40px;
border-radius:28px;

background:rgba(10,10,10,0.78);
backdrop-filter:blur(14px);

border:1px solid rgba(0,255,255,0.28);

box-shadow:
0 0 18px rgba(0,255,255,0.22),
0 0 50px rgba(168,85,247,0.14);

animation:fadeUp 1s ease;
}

/* HEADING */
h2{
font-size:42px;
font-weight:800;
text-align:center;
margin-bottom:14px;
background:linear-gradient(90deg,#ffffff,#38bdf8,#d946ef);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* SUB TEXT */
.subtitle{
text-align:center;
color:#bfbfbf;
margin-bottom:30px;
font-size:16px;
}

/* FORM INPUTS */
input,
select{
width:100%;
padding:16px 18px;
border-radius:14px;
background:rgba(255,255,255,0.03);
border:1px solid rgba(0,255,255,0.22);
color:white;
outline:none;
font-size:16px;
transition:.3s ease;
}

input:focus,
select:focus{
border-color:#00ffff;
box-shadow:0 0 14px rgba(0,255,255,.45);
}

/* STEP CARDS */
.step{
display:none;
}

.step.active{
display:block;
animation:fadeStep .55s ease;
}

/* OPTION BUTTONS */
.choice{
padding:14px;
border-radius:16px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
color:white;
cursor:pointer;
transition:.28s ease;
font-weight:600;
}

.choice:hover{
transform:translateY(-4px) scale(1.03);
border-color:#00ffff;
box-shadow:0 0 18px rgba(0,255,255,.22);
}

.choice.selected{
background:linear-gradient(90deg,#06b6d4,#d946ef);
color:white;
border:none;
box-shadow:0 0 24px rgba(0,255,255,.55);
}

/* NEXT BUTTON */
#nextBtn,
button[type="submit"]{
background:linear-gradient(90deg,#00c6ff,#d946ef);
color:white;
font-weight:700;
border:none;
padding:14px 26px;
border-radius:16px;
cursor:pointer;
transition:.3s ease;
}

#nextBtn:hover,
button[type="submit"]:hover{
transform:scale(1.04);
box-shadow:
0 0 18px rgba(0,255,255,.45),
0 0 28px rgba(217,70,239,.35);
}

/* BACK BUTTON */
#prevBtn{
background:rgba(255,255,255,0.05);
color:white;
border:1px solid rgba(255,255,255,0.08);
padding:14px 24px;
border-radius:16px;
cursor:pointer;
}

/* PROGRESS */
.progressWrap{
width:100%;
height:8px;
background:rgba(255,255,255,0.07);
border-radius:999px;
overflow:hidden;
margin-bottom:12px;
}

#progressBar{
height:100%;
width:33%;
background:linear-gradient(90deg,#00ffff,#d946ef);
box-shadow:0 0 16px rgba(0,255,255,.55);
transition:.45s ease;
}

/* ANIMATIONS */
@keyframes fadeUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeStep{
from{
opacity:0;
transform:translateX(24px);
}
to{
opacity:1;
transform:translateX(0);
}
}

/* MOBILE */
@media(max-width:768px){

.glass{
padding:22px;
border-radius:22px;
}

h2{
font-size:30px;
}

.choice{
padding:12px;
font-size:14px;
}
}
</style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4 py-10">

<div id="particles-js"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="glow-orb orb3"></div>

<div class="glass w-full max-w-4xl rounded-3xl p-8 shadow-2xl">

<!-- Progress -->
<div class="mb-8">
<div class="w-full h-3 bg-white/10 rounded-full overflow-hidden">
<div id="progressBar" class="h-3 bg-cyan-400 w-1/3 transition-all duration-500"></div>
</div>
<p class="mt-2 text-sm text-gray-300">Step <span id="stepNum">1</span> of 3</p>
</div>

<form method="POST" action="/plan">

<!-- SCREEN 1 -->
<div class="step active">

<h2 class="text-3xl font-bold mb-6">Start Your Journey</h2>

<label class="block mb-2">Current Location</label>

<div class="relative mb-6">
  <input 
    type="text" 
    name="current_location"
    id="locationInput"
    placeholder="Ex: Kukatpally"
    autocomplete="off"
    class="w-full p-4 rounded-xl bg-white/10 outline-none">

  <!-- Suggestions Box -->
  <div id="suggestionsBox"
    class="absolute top-full left-0 w-full bg-black border border-cyan-400 rounded-xl mt-1 hidden z-50 max-h-40 overflow-y-auto">
  </div>
</div>

<label class="block mb-2">Destination Area</label>
<select name="destination"
class="w-full p-3 rounded-xl bg-black text-white border border-cyan-400">

<option value="Anywhere">Anywhere</option>

{% for area in destinations %}
<option value="{{ area }}">{{ area }}</option>
{% endfor %}

</select>

</div>

<!-- SCREEN 2 -->
<div class="step">

<h2 class="text-3xl font-bold mb-6">Your Preferences</h2>

<p class="mb-2">Interest</p>
<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
<button type="button" class="choice p-3 rounded-xl bg-white/10">Food</button>
<button type="button" class="choice p-3 rounded-xl bg-white/10">Nature</button>
<button type="button" class="choice p-3 rounded-xl bg-white/10">History</button>
<button type="button" class="choice p-3 rounded-xl bg-white/10">Shopping</button>
<button type="button" class="choice p-3 rounded-xl bg-white/10">Nightlife</button>
</div>

<input type="hidden" name="interest" id="interestInput">

<p class="mb-2">Who’s Coming?</p>
<div class="grid grid-cols-2 gap-3 mb-6">
<button type="button" class="company choice p-3 rounded-xl bg-white/10">Solo</button>
<button type="button" class="company choice p-3 rounded-xl bg-white/10">Couple</button>
<button type="button" class="company choice p-3 rounded-xl bg-white/10">Friends</button>
<button type="button" class="company choice p-3 rounded-xl bg-white/10">Family</button>
</div>

<input type="hidden" name="company" id="companyInput">

<p class="mb-2">Mood</p>
<div class="grid grid-cols-2 gap-3">
<button type="button" class="mood choice p-3 rounded-xl bg-white/10">Relaxed</button>
<button type="button" class="mood choice p-3 rounded-xl bg-white/10">Fun</button>
<button type="button" class="mood choice p-3 rounded-xl bg-white/10">Romantic</button>
<button type="button" class="mood choice p-3 rounded-xl bg-white/10">Adventure</button>
</div>

<input type="hidden" name="mood" id="moodInput">

</div>

<!-- SCREEN 3 -->
<div class="step">

<h2 class="text-3xl font-bold mb-6">Budget & Time</h2>

<label class="block mb-2">Budget ₹</label>
<input type="range" min="500" max="10000" step="100" value="2000"
id="budgetSlider" class="w-full mb-3">

<p class="text-cyan-400 text-2xl font-bold mb-6">
₹<span id="budgetValue">2000</span>
</p>

<input type="hidden" name="budget" id="budgetInput" value="2000">

<label class="block mb-2">Duration</label>
<select name="duration"
class="w-full p-4 rounded-xl bg-black/40 mb-8">
<option>4 Hours</option>
<option>1 Day</option>
<option>Weekend</option>
<option>Night</option>
</select>

<button type="submit"
class="w-full py-4 rounded-xl bg-cyan-500 text-black font-bold text-lg hover:scale-105 transition">
Generate My Plan 🚀
</button>

</div>

<!-- Nav Buttons -->
<div class="flex justify-between mt-8">
<button type="button" id="prevBtn"
class="px-6 py-3 rounded-xl bg-white/10 hidden">
Back
</button>

<button type="button" id="nextBtn"
class="px-6 py-3 rounded-xl bg-cyan-500 text-black font-bold ml-auto">
Next →
</button>
</div>

</form>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
tsParticles.load("particles-js", {
fullScreen:{enable:false},
particles:{
number:{value:50},
color:{value:["#00ffff","#ffffff","#ffd700"]},
size:{value:{min:3,max:6}},
move:{enable:true,speed:1},
opacity:{value:0.6}
}
});

let step=0;
const steps=document.querySelectorAll(".step");
const next=document.getElementById("nextBtn");
const prev=document.getElementById("prevBtn");
const progress=document.getElementById("progressBar");
const stepNum=document.getElementById("stepNum");

function showStep(i){
steps.forEach(s=>s.classList.remove("active"));
steps[i].classList.add("active");

stepNum.innerText=i+1;
progress.style.width=((i+1)/3)*100+"%";

prev.style.display=i===0?"none":"block";
next.style.display=i===2?"none":"block";
}

next.onclick=()=>{ if(step<2){step++;showStep(step);} }
prev.onclick=()=>{ if(step>0){step--;showStep(step);} }

document.getElementById("budgetSlider").oninput=function(){
document.getElementById("budgetValue").innerText=this.value;
document.getElementById("budgetInput").value=this.value;
}

function bindChoice(selector,inputId){
document.querySelectorAll(selector).forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(selector).forEach(x=>x.classList.remove("selected"));
btn.classList.add("selected");
document.getElementById(inputId).value=btn.innerText;
}
});
}

bindChoice(".choice:not(.company):not(.mood)","interestInput");
bindChoice(".company","companyInput");
bindChoice(".mood","moodInput");

// 🔥 Hyderabad Areas (you can expand later from backend)
const hyderabadAreas = [
"Kukatpally","Ameerpet","Banjara Hills","Jubilee Hills","Madhapur",
"Gachibowli","Hitech City","Uppal","Secunderabad","Begumpet",
"LB Nagar","Dilsukhnagar","Mehdipatnam","Somajiguda","Kondapur","Gatkesar","Kphp"
];

const input = document.getElementById("locationInput");
const box = document.getElementById("suggestionsBox");

input.addEventListener("input", () => {
  const value = input.value.toLowerCase();
  box.innerHTML = "";

  if (!value) {
    box.classList.add("hidden");
    return;
  }

  const filtered = hyderabadAreas.filter(place =>
    place.toLowerCase().includes(value)
  );

  if (filtered.length === 0) {
    box.classList.add("hidden");
    return;
  }

  box.classList.remove("hidden");

  filtered.forEach(place => {
    const div = document.createElement("div");
    div.textContent = place;
    div.className = "p-3 hover:bg-cyan-500 cursor-pointer";

    div.onclick = () => {
      input.value = place;
      box.classList.add("hidden");
    };

    box.appendChild(div);
  });
});

// hide on outside click
document.addEventListener("click", (e) => {
  if (!input.contains(e.target) && !box.contains(e.target)) {
    box.classList.add("hidden");
  }
});
</script>

</body>
</html>
