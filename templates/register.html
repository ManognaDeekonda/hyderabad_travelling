<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Hyderabad Trip Planner</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #03050a;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* ========================================
           PAGE
        ======================================== */

        .page {
            min-height: 100vh;
            position: relative;
            overflow: hidden;

            background: #03050a;
        }


        /* ========================================
           HYDERABAD BACKGROUND
        ======================================== */

        .city-background {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(3, 5, 10, 0.15) 0%,
                    rgba(3, 5, 10, 0.10) 35%,
                    rgba(3, 5, 10, 0.68) 60%,
                    rgba(3, 5, 10, 0.96) 100%
                ),
                linear-gradient(
                    0deg,
                    rgba(3, 5, 10, 0.65),
                    transparent 50%
                ),
                url("/static/images/hyderabad-register.jpg");

            background-size: cover;

            /* keeps Charminar visible */
            background-position: center center;

            opacity: 0.82;

            z-index: 0;
        }


        /* ========================================
           NAVBAR
        ======================================== */

        .navbar {
            position: relative;
            z-index: 5;

            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 4.5%;
        }

        .brand {
            color: white;

            font-size: 25px;
            font-weight: 700;

            letter-spacing: -0.7px;

            text-decoration: none;
        }

        .brand-gradient {
            background: linear-gradient(
                90deg,
                #00cfff,
                #d946ef
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        /* ========================================
           MAIN
        ======================================== */

        .content {
            position: relative;
            z-index: 2;

            min-height: calc(100vh - 70px);

            display: grid;

            grid-template-columns: 1fr 1fr;

            align-items: center;

            padding: 5px 6% 30px;
        }


        /* ========================================
           LEFT HERO
        ======================================== */

        .hero {
            max-width: 600px;

            padding-left: 1%;

            margin-top: -15px;
        }

        .hero-small {
            font-size: 13px;

            letter-spacing: 7px;

            color: rgba(255,255,255,0.78);

            margin-bottom: 12px;
        }

        .hero-title {
            margin: 0;

            font-size: clamp(55px, 5.2vw, 82px);

            line-height: 0.92;

            font-weight: 800;

            letter-spacing: -4px;
        }

        .hero-title-gradient {
            background: linear-gradient(
                90deg,
                #00cfff,
                #8b7cff,
                #d946ef
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            margin-top: 18px;

            font-size: 27px;

            letter-spacing: 6px;

            color: rgba(255,255,255,0.88);
        }

        .hero-line {
            width: 65px;
            height: 3px;

            margin: 23px 0;

            background: linear-gradient(
                90deg,
                #00cfff,
                #d946ef
            );
        }

        .hero-description {
            font-size: 14px;

            letter-spacing: 5px;

            color: rgba(255,255,255,0.72);
        }


        /* ========================================
           BOTTOM TAGLINE
        ======================================== */

        .hero-tagline {
            position: absolute;

            left: 6%;

            bottom: 30px;

            z-index: 4;

            font-size: 10px;

            letter-spacing: 4px;

            color: rgba(255,255,255,0.58);
        }

        .hero-tagline::before {
            content: "";

            display: inline-block;

            width: 28px;
            height: 1px;

            margin-right: 12px;

            vertical-align: middle;

            background: #00cfff;
        }


        /* ========================================
           REGISTER AREA
        ======================================== */

        .register-area {
            display: flex;

            justify-content: center;

            align-items: center;

            padding-left: 4%;
        }

        .register-container {
            width: 100%;

            max-width: 590px;
        }


        /* ========================================
           REGISTER HEADING
        ======================================== */

        .register-heading {
            text-align: center;

            margin-bottom: 17px;
        }

        .register-heading-small {
            font-size: 12px;

            letter-spacing: 5px;

            color: #00d9ff;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .register-heading h1 {
            margin: 0;

            font-size: 49px;

            line-height: 1;

            letter-spacing: -2px;

            font-weight: 800;
        }

        .register-heading h1 span {
            background: linear-gradient(
                90deg,
                #00cfff,
                #d946ef
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-heading p {
            margin: 10px auto 0;

            max-width: 450px;

            font-size: 15px;

            line-height: 1.45;

            color: rgba(255,255,255,0.65);
        }


        /* ========================================
           GLASS CARD
        ======================================== */

        .register-card {
            position: relative;

            padding: 27px 37px 25px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    rgba(16, 25, 45, 0.82),
                    rgba(10, 12, 25, 0.70)
                );

            backdrop-filter: blur(24px);

            -webkit-backdrop-filter: blur(24px);

            border: 1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.60),
                inset 0 0 45px rgba(255,255,255,0.02);
        }


        /* NEON BORDER */

        .register-card::before {
            content: "";

            position: absolute;

            inset: -1px;

            border-radius: 25px;

            padding: 1px;

            background: linear-gradient(
                135deg,
                rgba(0,207,255,0.75),
                transparent 42%,
                rgba(217,70,239,0.75)
            );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;

            mask-composite: exclude;

            pointer-events: none;
        }


        /* ========================================
           FORM
        ======================================== */

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 500;

            color: rgba(255,255,255,0.90);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: rgba(255,255,255,0.70);

            font-size: 18px;

            pointer-events: none;
        }

        .input-field {
            width: 100%;

            height: 56px;

            padding: 0 50px;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.17);

            background: rgba(255,255,255,0.065);

            color: white;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-field::placeholder {
            color: rgba(255,255,255,0.40);
        }

        .input-field:focus {
            outline: none;

            border-color: rgba(0,207,255,0.70);

            background: rgba(255,255,255,0.085);

            box-shadow:
                0 0 0 3px rgba(0,207,255,0.08);
        }


        /* ========================================
           PASSWORD TOGGLE
        ======================================== */

        .password-eye {
            position: absolute;

            right: 17px;
            top: 50%;

            transform: translateY(-50%);

            color: rgba(255,255,255,0.75);

            cursor: pointer;

            font-size: 17px;
        }


        /* ========================================
           CREATE ACCOUNT BUTTON
        ======================================== */

        .register-button {
            width: 100%;

            height: 58px;

            margin-top: 4px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(
                90deg,
                #00cfff,
                #8b7cff,
                #d946ef
            );

            color: #050509;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .register-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 35px rgba(0,207,255,0.22);
        }


        /* ========================================
           DIVIDER
        ======================================== */

        .divider {
            display: flex;

            align-items: center;

            gap: 16px;

            margin: 18px 0 15px;

            color: rgba(255,255,255,0.65);

            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: rgba(255,255,255,0.16);
        }


        /* ========================================
           LOGIN LINK
        ======================================== */

        .login-text {
            text-align: center;

            font-size: 14px;

            color: rgba(255,255,255,0.75);
        }

        .login-text a {
            color: #00d9ff;

            font-weight: 600;

            text-decoration: none;
        }

        .login-text a:hover {
            color: #66e8ff;
        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 1050px) {

            .content {
                grid-template-columns: 1fr;

                padding: 25px 25px 45px;
            }

            .hero {
                display: none;
            }

            .register-area {
                padding-left: 0;
            }

            .hero-tagline {
                display: none;
            }
        }


        @media (max-width: 600px) {

            .navbar {
                height: 62px;

                padding: 0 20px;
            }

            .brand {
                font-size: 19px;
            }

            .content {
                min-height: calc(100vh - 62px);

                padding: 20px 16px 30px;
            }

            .register-heading {
                margin-bottom: 15px;
            }

            .register-heading-small {
                font-size: 10px;

                letter-spacing: 3px;
            }

            .register-heading h1 {
                font-size: 37px;
            }

            .register-heading p {
                font-size: 13px;
            }

            .register-card {
                padding: 23px 19px 22px;
            }

            .input-field {
                height: 53px;
            }

            .register-button {
                height: 55px;
            }
        }

    </style>

</head>


<body>

<div class="page">


    <!-- ======================================
         HYDERABAD BACKGROUND
    ======================================= -->

    <div class="city-background"></div>


    <!-- ======================================
         NAVBAR
    ======================================= -->

    <nav class="navbar">

        <a href="/" class="brand">

            Hyderabad

            <span class="brand-gradient">
                Trip Planner
            </span>

        </a>

    </nav>


    <!-- ======================================
         MAIN CONTENT
    ======================================= -->

    <main class="content">


        <!-- ==================================
             LEFT SIDE
        =================================== -->

        <section class="hero">

            <div class="hero-small">
                EXPLORE
            </div>


            <h2 class="hero-title">

                <span class="hero-title-gradient">
                    Hyderabad
                </span>

            </h2>


            <div class="hero-subtitle">
                Beyond the Usual
            </div>


            <div class="hero-line"></div>


            <div class="hero-description">
                PLAN&nbsp;&nbsp;·&nbsp;&nbsp;EXPLORE&nbsp;&nbsp;·&nbsp;&nbsp;EXPERIENCE
            </div>

        </section>


        <!-- ==================================
             REGISTER
        =================================== -->

        <section class="register-area">

            <div class="register-container">


                <!-- HEADING -->

                <div class="register-heading">

                    <div class="register-heading-small">
                        CREATE YOUR ACCOUNT
                    </div>


                    <h1>

                        Join the
                        <span>Journey</span>

                    </h1>


                    <p>
                        Create an account to start planning your
                        Hyderabad experience.
                    </p>

                </div>


                <!-- ==================================
                     CARD
                =================================== -->

                <div class="register-card">


                    <form id="registerForm">


                        <!-- NAME -->

                        <div class="form-group">

                            <label
                                for="name"
                                class="form-label"
                            >
                                Full Name
                            </label>


                            <div class="input-wrapper">

                                <span class="input-icon">
                                    ♙
                                </span>


                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    class="input-field"
                                    placeholder="Enter your full name"
                                    required
                                >

                            </div>

                        </div>


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email
                            </label>


                            <div class="input-wrapper">

                                <span class="input-icon">
                                    ✉
                                </span>


                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="input-field"
                                    placeholder="Enter your email"
                                    required
                                >

                            </div>

                        </div>


                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>


                            <div class="input-wrapper">

                                <span class="input-icon">
                                    🔒
                                </span>


                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="input-field"
                                    placeholder="Create a password"
                                    required
                                >


                                <span
                                    class="password-eye"
                                    id="togglePassword"
                                >
                                    ◉
                                </span>

                            </div>

                        </div>


                        <!-- CREATE ACCOUNT -->

                        <button
                            type="submit"
                            class="register-button"
                        >
                            Create Account
                        </button>


                    </form>


                    <!-- DIVIDER -->

                    <div class="divider">
                        OR
                    </div>


                    <!-- LOGIN -->

                    <div class="login-text">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </div>


                </div>

            </div>

        </section>

    </main>


    <!-- ======================================
         BOTTOM TAGLINE
    ======================================= -->

    <div class="hero-tagline">
        HYDERABAD · A CITY OF STORIES
    </div>


</div>


<!-- ========================================
     PASSWORD TOGGLE
========================================= -->

<script>

/* ================================
   PASSWORD TOGGLE
================================ */

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

    } else {

        passwordInput.type = "password";

    }

});


/* ================================
   REGISTER
================================ */

const registerForm =
    document.getElementById("registerForm");

registerForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch("/api/auth/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.error || "Registration failed.");

            return;
        }


        /*
         * Registration successful.
         *
         * We DO NOT create/store a JWT here.
         * The user must login separately.
         */

        alert("Account created successfully!");


        window.location.href = "/login";

    } catch (error) {

        console.error("Registration error:", error);

        alert("Could not connect to the server.");

    }

});

</script>


</body>

</html>
